<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-WIP V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 p-4">

    <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 mb-4">
        <div class="text-[10px] font-bold text-zinc-400">CLOUD CONNECTION STATUS</div>
        <div id="syncIndicator" class="text-xs text-emerald-400 font-bold">Cloud Online Sync ON</div>
        <div id="activityLogs" class="text-[9px] font-mono mt-2 text-zinc-500 h-12 overflow-y-auto">
            <div>[SYSTEM] Menunggu koneksi...</div>
        </div>
    </div>

    <form id="formProduksi" class="bg-zinc-900 p-4 rounded-lg border border-zinc-800 space-y-3 mb-6">
        <input type="text" id="cust" placeholder="Customer" class="w-full bg-black p-2 rounded text-xs border border-zinc-700" required>
        <input type="text" id="item" placeholder="Item/Part" class="w-full bg-black p-2 rounded text-xs border border-zinc-700" required>
        <input type="number" id="qty" placeholder="Jumlah (Pcs)" class="w-full bg-black p-2 rounded text-xs border border-zinc-700" required>
        <button type="submit" class="w-full bg-cyan-700 text-xs py-2 rounded font-bold uppercase">Submit Ke Cloud</button>
    </form>

    <div class="overflow-x-auto border border-zinc-800 rounded-lg">
        <table id="tabelWip" class="w-full text-xs text-left">
            <thead class="bg-zinc-900 text-zinc-400 uppercase">
                <tr><th class="p-2">Customer</th><th class="p-2">Item</th><th class="p-2">Qty</th><th class="p-2">Aksi</th></tr>
            </thead>
            <tbody id="tabelBody" class="divide-y divide-zinc-800"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhbnh0dWJwZGVrcGRhamFkdXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MDg0NTQsImV4cCI6MjA5NTE4NDQ1NH0.pcW8pEWxZefCx6V6LMAL61LBt4H8P5jdTN8WM8z7a8o"; 
        const SUPABASE_URL = "https://banxtubpdekpdajadupz.supabase.co";

        function addLog(msg) {
            const logs = document.getElementById('activityLogs');
            logs.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>` + logs.innerHTML;
        }

        async function loadData() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/produksi?select=*&order=id.desc`, {
                    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                const body = document.getElementById('tabelBody');
                body.innerHTML = data.map(row => `
                    <tr>
                        <td class="p-2">${row.customer || '-'}</td>
                        <td class="p-2">${row.nama_item || '-'}</td>
                        <td class="p-2">${row.jumlah_ok || 0}</td>
                        <td class="p-2"><button onclick="editData(${row.id}, ${row.jumlah_ok})" class="text-cyan-400">✏️</button></td>
                    </tr>
                `).join('');
                document.getElementById('syncIndicator').innerText = "Cloud Online Sync ON";
                addLog("Data sinkron berhasil");
            } catch(e) {
                document.getElementById('syncIndicator').innerText = "Offline Mode";
                document.getElementById('syncIndicator').className = "text-xs text-red-400 font-bold";
                addLog("Gagal terhubung Cloud");
            }
        }

        async function editData(id, currentQty) {
            const newQty = prompt("Edit Qty:", currentQty);
            if(newQty) {
                await fetch(`${SUPABASE_URL}/rest/v1/produksi?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ jumlah_ok: parseInt(newQty) })
                });
                loadData();
            }
        }

        document.getElementById('formProduksi').addEventListener('submit', async (e) => {
            e.preventDefault();
            addLog("Mengirim ke Cloud...");
            const payload = {
                customer: document.getElementById('cust').value,
                nama_item: document.getElementById('item').value,
                jumlah_ok: parseInt(document.getElementById('qty').value)
            };
            await fetch(`${SUPABASE_URL}/rest/v1/produksi`, {
                method: 'POST',
                headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            document.getElementById('formProduksi').reset();
            loadData();
        });

        loadData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-WIP PRO V3.9.6</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>body { font-family: 'Inter', sans-serif; background: #09090b; color: #e4e4e7; }</style>
</head>
<body class="p-4">

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
            <h1 class="text-xl font-bold text-cyan-400">CYBER-WIP PRO</h1>
            <button onclick="exportToExcel()" class="bg-emerald-600 px-4 py-2 rounded-lg text-xs font-bold">⬇️ DOWNLOAD EXCEL</button>
        </div>

        <form id="formProduksi" class="grid grid-cols-2 md:grid-cols-4 gap-2 bg-zinc-900 p-4 rounded-xl border border-zinc-800">
            <input type="text" id="cust" placeholder="Customer" class="bg-black p-2 rounded text-xs border border-zinc-700" required>
            <input type="text" id="item" placeholder="Part Number" class="bg-black p-2 rounded text-xs border border-zinc-700" required>
            <input type="number" id="qty" placeholder="Jumlah" class="bg-black p-2 rounded text-xs border border-zinc-700" required>
            <button type="submit" class="bg-cyan-600 rounded text-xs font-bold">SUBMIT</button>
        </form>

        <div class="overflow-x-auto">
            <table id="tabelWip" class="w-full text-xs text-left border border-zinc-800">
                <thead class="bg-zinc-900 uppercase">
                    <tr>
                        <th class="p-3">Customer</th>
                        <th class="p-3">Part</th>
                        <th class="p-3">Qty</th>
                        <th class="p-3">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelBody" class="divide-y divide-zinc-800"></tbody>
            </table>
        </div>
    </div>

    <script>
        // GANTI KEY INI DENGAN ANON KEY SUPABASE KAMU
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhbnh0dWJwZGVrcGRhamFkdXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MDg0NTQsImV4cCI6MjA5NTE4NDQ1NH0.pcW8pEWxZefCx6V6LMAL61LBt4H8P5jdTN8WM8z7a8o";
        const SUPABASE_URL = "https://banxtubpdekpdajadupz.supabase.co";

        async function fetchData() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/produksi?select=*`, {
                headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const data = await res.json();
            renderTable(data);
        }

        function renderTable(data) {
            const body = document.getElementById('tabelBody');
            body.innerHTML = data.map(row => `
                <tr>
                    <td class="p-3">${row.customer}</td>
                    <td class="p-3">${row.nama_item}</td>
                    <td class="p-3">${row.jumlah_ok}</td>
                    <td class="p-3">
                        <button onclick="editData('${row.id}')" class="text-blue-400">✏️</button>
                    </td>
                </tr>
            `).join('');
        }

        function exportToExcel() {
            let table = document.getElementById("tabelWip");
            let html = table.outerHTML;
            let a = document.createElement('a');
            a.href = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
            a.download = 'Data_WIP.xls';
            a.click();
        }

        function editData(id) { alert("Mode Edit untuk ID: " + id); }

        document.getElementById('formProduksi').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Logika POST ke Supabase...
            alert("Data terkirim!");
        });

        fetchData();
    </script>
</body>
</html>

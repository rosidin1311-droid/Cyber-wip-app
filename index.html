<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-WIP PRO V3.9.6</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <style>body { font-family: 'Inter', sans-serif; background: #09090b; }</style>
</head>
<body class="text-zinc-100">

    <header class="border-b border-zinc-800 p-4 flex justify-between items-center bg-zinc-950">
        <h1 class="text-sm font-bold text-cyan-400 tracking-wider uppercase">CYBER-WIP MONITOR</h1>
        <div class="flex gap-2">
            <button onclick="exportToExcel()" class="bg-emerald-700 text-[10px] px-3 py-1.5 rounded font-bold">📥 EXCEL</button>
            <button onclick="toggleModal(true)" class="bg-zinc-800 text-[10px] px-3 py-1.5 rounded font-bold">⚙️ SETUP</button>
        </div>
    </header>

    <main class="p-4 space-y-6">
        <form id="formProduksi" class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="cust" placeholder="Customer" class="bg-black p-2 rounded text-xs border border-zinc-700" required>
                <input type="text" id="item" placeholder="Item/Part" class="bg-black p-2 rounded text-xs border border-zinc-700" required>
            </div>
            <input type="number" id="qty" placeholder="Jumlah (Pcs)" class="w-full bg-black p-2 rounded text-xs border border-zinc-700" required>
            <button type="submit" class="w-full bg-cyan-700 text-xs py-2 rounded font-bold">SUBMIT DATA</button>
        </form>

        <div class="overflow-x-auto border border-zinc-800 rounded-xl">
            <table id="tabelWip" class="w-full text-xs text-left">
                <thead class="bg-zinc-900 text-zinc-400">
                    <tr><th class="p-3">Customer</th><th class="p-3">Item</th><th class="p-3">Qty</th><th class="p-3">Edit</th></tr>
                </thead>
                <tbody id="tabelBody" class="divide-y divide-zinc-800"></tbody>
            </table>
        </div>
    </main>

    <script>
        // MASUKKAN ANON KEY KAMU DI SINI
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhbnh0dWJwZGVrcGRhamFkdXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MDg0NTQsImV4cCI6MjA5NTE4NDQ1NH0.pcW8pEWxZefCx6V6LMAL61LBt4H8P5jdTN8WM8z7a8o";
        const SUPABASE_URL = "https://banxtubpdekpdajadupz.supabase.co";

        async function loadData() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/produksi?select=*&order=id.desc`, {
                    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                renderTable(data);
            } catch (e) { console.error("Gagal load:", e); }
        }

        function renderTable(data) {
            const body = document.getElementById('tabelBody');
            body.innerHTML = data.map(row => `
                <tr class="hover:bg-zinc-900">
                    <td class="p-3">${row.customer || '-'}</td>
                    <td class="p-3">${row.nama_item || '-'}</td>
                    <td class="p-3">${row.jumlah_ok || row.sisa_wip || 0}</td>
                    <td class="p-3"><button onclick="alert('Fitur edit aktif')" class="text-cyan-400">✏️</button></td>
                </tr>
            `).join('');
        }

        function exportToExcel() {
            let table = document.getElementById("tabelWip");
            let html = table.outerHTML;
            let a = document.createElement('a');
            a.href = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
            a.download = 'Data_WIP.xls';
            a.click();
        }

        document.getElementById('formProduksi').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                customer: document.getElementById('cust').value,
                nama_item: document.getElementById('item').value,
                jumlah_ok: parseInt(document.getElementById('qty').value)
            };
            
            await fetch(`${SUPABASE_URL}/rest/v1/produksi`, {
                method: 'POST',
                headers: { 
                    "apikey": SUPABASE_ANON_KEY, 
                    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });
            alert("Data terkirim!");
            loadData();
        });

        loadData();
    </script>
</body>
</html>
